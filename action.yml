name: CqrsLens
description: >-
  Statically scan a .NET solution (no build required) and generate an
  architecture report — project graph, Clean Architecture layers, CQRS map
  (requests, handlers, validators), pipeline behaviors, DbContexts,
  architecture checks, and pull request architecture diffs — as Markdown,
  HTML (Mermaid or pre-rendered SVG), or JSON.
author: Abdullah Hakim
branding:
  icon: search
  color: purple

inputs:
  path:
    description: Folder of the .NET solution to scan.
    required: false
    default: '.'
  output:
    description: Report file to write.
    required: false
    default: 'ARCHITECTURE.md'
  format:
    description: 'Report format: md, html, or json.'
    required: false
    default: 'md'
  render:
    description: 'HTML diagram rendering mode override: empty (config/default), mermaid, or svg.'
    required: false
    default: ''
  watermark:
    description: 'Optional custom watermark text rendered in the console and embedded in generated reports.'
    required: false
    default: ''
  strict:
    description: Fail the step when architecture checks report any new error.
    required: false
    default: 'false'
  markers:
    description: Comma-separated custom marker interfaces (e.g. ICommand,IQuery).
    required: false
    default: ''
  handler-markers:
    description: Comma-separated custom handler roots for external wrappers (e.g. ICommandHandler,IQueryHandler).
    required: false
    default: ''
  analysis:
    description: 'Analysis backend override: empty (config/default), text, or roslyn.'
    required: false
    default: ''
  config:
    description: Path to a .cqrslens.json file; empty auto-discovers at the scan root.
    required: false
    default: ''
  baseline:
    description: Baseline file for new-only strict checks.
    required: false
    default: ''
  diff-base:
    description: 'Base scan to compare against (path to a base ARCHITECTURE.json report or base solution folder). When empty and comment-pr is true on a pull_request, the PR base ref is scanned automatically.'
    required: false
    default: ''
  diff-output:
    description: 'Architecture diff report file to write (defaults to cqrslens-diff.md when diff-base or comment-pr is enabled).'
    required: false
    default: ''
  comment-pr:
    description: 'Post or update a sticky pull request comment with the architecture diff. Requires pull-requests: write permission.'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token used to post or update the pull request comment when comment-pr is true.'
    required: false
    default: ${{ github.token }}
  sarif-output:
    description: SARIF 2.1.0 file to write; set to empty to disable.
    required: false
    default: 'cqrslens-results.sarif'
  upload-sarif:
    description: Upload the generated SARIF to GitHub code scanning.
    required: false
    default: 'false'
  annotations:
    description: Emit file/line GitHub Actions annotations for new findings.
    required: false
    default: 'true'
  version:
    description: CqrsLens NuGet tool version to install.
    required: false
    default: '0.7.0'

outputs:
  report-path:
    description: Path of the generated report file.
    value: ${{ steps.scan.outputs.report-path }}
  sarif-path:
    description: Path of the generated SARIF file (empty when disabled).
    value: ${{ steps.scan.outputs.sarif-path }}
  diff-path:
    description: Path of the generated architecture diff file (empty when disabled).
    value: ${{ steps.scan.outputs.diff-path }}

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Install CqrsLens
      shell: bash
      env:
        CQRSLENS_VERSION: ${{ inputs.version }}
      run: |
        if ! dotnet tool install --global CqrsLens --version "$CQRSLENS_VERSION"; then
          dotnet tool update --global CqrsLens --version "$CQRSLENS_VERSION"
        fi

    - name: Scan
      id: scan
      shell: bash
      env:
        CQRSLENS_PATH: ${{ inputs.path }}
        CQRSLENS_OUTPUT: ${{ inputs.output }}
        CQRSLENS_FORMAT: ${{ inputs.format }}
        CQRSLENS_RENDER: ${{ inputs.render }}
        CQRSLENS_WATERMARK: ${{ inputs.watermark }}
        CQRSLENS_STRICT: ${{ inputs.strict }}
        CQRSLENS_MARKERS: ${{ inputs.markers }}
        CQRSLENS_HANDLER_MARKERS: ${{ inputs.handler-markers }}
        CQRSLENS_ANALYSIS: ${{ inputs.analysis }}
        CQRSLENS_CONFIG: ${{ inputs.config }}
        CQRSLENS_BASELINE: ${{ inputs.baseline }}
        CQRSLENS_DIFF_BASE: ${{ inputs.diff-base }}
        CQRSLENS_DIFF_OUTPUT: ${{ inputs.diff-output }}
        CQRSLENS_COMMENT_PR: ${{ inputs.comment-pr }}
        CQRSLENS_SARIF: ${{ inputs.sarif-output }}
        CQRSLENS_ANNOTATIONS: ${{ inputs.annotations }}
        CQRSLENS_SUMMARY: ${{ runner.temp }}/cqrslens-summary.md
        CQRSLENS_BASE_WORKTREE: ${{ runner.temp }}/cqrslens-base-worktree
      run: |
        cleanup_worktree() {
          if [ -d "$CQRSLENS_BASE_WORKTREE" ]; then
            git worktree remove --force "$CQRSLENS_BASE_WORKTREE" 2>/dev/null || rm -rf "$CQRSLENS_BASE_WORKTREE"
          fi
        }
        trap cleanup_worktree EXIT

        if [ -z "$CQRSLENS_DIFF_BASE" ] && [ "$CQRSLENS_COMMENT_PR" = "true" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
          if git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF" 2>/dev/null &&
             git worktree add --detach "$CQRSLENS_BASE_WORKTREE" FETCH_HEAD 2>/dev/null; then
            if [ -d "$CQRSLENS_BASE_WORKTREE/$CQRSLENS_PATH" ]; then
              CQRSLENS_DIFF_BASE="$CQRSLENS_BASE_WORKTREE/$CQRSLENS_PATH"
            fi
          fi
        fi

        if [ -n "$CQRSLENS_DIFF_BASE" ] && [ -z "$CQRSLENS_DIFF_OUTPUT" ]; then
          CQRSLENS_DIFF_OUTPUT="cqrslens-diff.md"
        fi

        args=("$CQRSLENS_PATH" -o "$CQRSLENS_OUTPUT" --format "$CQRSLENS_FORMAT" \
          --ci-root "$GITHUB_WORKSPACE" \
          --summary "$CQRSLENS_SUMMARY")
        if [ -n "$CQRSLENS_RENDER" ]; then
          args+=(--render "$CQRSLENS_RENDER")
        fi
        if [ -n "$CQRSLENS_WATERMARK" ]; then
          args+=(--watermark "$CQRSLENS_WATERMARK")
        fi
        if [ "$CQRSLENS_STRICT" = "true" ]; then
          args+=(--strict)
        fi
        if [ -n "$CQRSLENS_MARKERS" ]; then
          args+=(--markers "$CQRSLENS_MARKERS")
        fi
        if [ -n "$CQRSLENS_HANDLER_MARKERS" ]; then
          args+=(--handler-markers "$CQRSLENS_HANDLER_MARKERS")
        fi
        if [ -n "$CQRSLENS_ANALYSIS" ]; then
          args+=(--analysis "$CQRSLENS_ANALYSIS")
        fi
        if [ -n "$CQRSLENS_CONFIG" ]; then
          args+=(--config "$CQRSLENS_CONFIG")
        fi
        if [ -n "$CQRSLENS_BASELINE" ]; then
          args+=(--baseline "$CQRSLENS_BASELINE")
        fi
        if [ -n "$CQRSLENS_DIFF_BASE" ]; then
          args+=(--diff "$CQRSLENS_DIFF_BASE")
        fi
        if [ -n "$CQRSLENS_DIFF_OUTPUT" ]; then
          args+=(--diff-output "$CQRSLENS_DIFF_OUTPUT")
        fi
        if [ -n "$CQRSLENS_SARIF" ]; then
          args+=(--sarif "$CQRSLENS_SARIF")
        fi
        if [ "$CQRSLENS_ANNOTATIONS" = "true" ]; then
          args+=(--github-annotations)
        fi

        set +e
        cqrslens "${args[@]}"
        status=$?
        set -e

        echo "report-path=$CQRSLENS_OUTPUT" >> "$GITHUB_OUTPUT"
        echo "sarif-path=$CQRSLENS_SARIF" >> "$GITHUB_OUTPUT"
        echo "diff-path=$CQRSLENS_DIFF_OUTPUT" >> "$GITHUB_OUTPUT"
        if [ -f "$CQRSLENS_DIFF_OUTPUT" ]; then
          cat "$CQRSLENS_DIFF_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
        elif [ -f "$CQRSLENS_SUMMARY" ]; then
          cat "$CQRSLENS_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$status"

    - name: Comment architecture diff on pull request
      if: always() && inputs.comment-pr == 'true' && github.event.pull_request.number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        DIFF_FILE: ${{ steps.scan.outputs.diff-path }}
        SUMMARY_FILE: ${{ runner.temp }}/cqrslens-summary.md
        COMMENT_BODY_FILE: ${{ runner.temp }}/cqrslens-pr-comment.md
      run: |
        MARKER="<!-- cqrslens-architecture-diff -->"
        if [ -n "$DIFF_FILE" ] && [ -f "$DIFF_FILE" ]; then
          cp "$DIFF_FILE" "$COMMENT_BODY_FILE"
        elif [ -f "$SUMMARY_FILE" ]; then
          {
            echo "$MARKER"
            cat "$SUMMARY_FILE"
          } > "$COMMENT_BODY_FILE"
        else
          echo "warning: no diff or summary file found to comment on PR." >&2
          exit 0
        fi

        EXISTING_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
          --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n 1 || true)

        if [ -n "$EXISTING_ID" ]; then
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING_ID}" \
            -F body=@"$COMMENT_BODY_FILE" > /dev/null
        else
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -F body=@"$COMMENT_BODY_FILE" > /dev/null
        fi

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cqrslens-architecture-report
        path: ${{ inputs.output }}
        if-no-files-found: warn

    - name: Upload architecture diff artifact
      if: always() && steps.scan.outputs.diff-path != ''
      uses: actions/upload-artifact@v7
      with:
        name: cqrslens-architecture-diff
        path: ${{ steps.scan.outputs.diff-path }}
        if-no-files-found: warn

    - name: Upload SARIF artifact
      if: always() && inputs.sarif-output != ''
      uses: actions/upload-artifact@v7
      with:
        name: cqrslens-sarif
        path: ${{ inputs.sarif-output }}
        if-no-files-found: warn

    - name: Upload SARIF to code scanning
      if: always() && inputs.upload-sarif == 'true' && inputs.sarif-output != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-output }}
        category: cqrslens
