name: CqrsLens
description: >-
  Statically scan a .NET solution (no build required) and generate an
  architecture report — project graph, Clean Architecture layers, CQRS map
  (requests, handlers, validators), pipeline behaviors, DbContexts, and
  architecture checks — as Markdown, HTML (Mermaid or pre-rendered SVG), or JSON.
author: Abdullah Hakim
branding:
  icon: search
  color: purple

inputs:
  path:
    description: Folder of the .NET solution to scan.
    required: false
    default: '.'
  output:
    description: Report file to write.
    required: false
    default: 'ARCHITECTURE.md'
  format:
    description: 'Report format: md, html, or json.'
    required: false
    default: 'md'
  render:
    description: 'HTML diagram rendering mode override: empty (config/default), mermaid, or svg.'
    required: false
    default: ''
  watermark:
    description: 'Optional custom watermark text rendered in the console and embedded in generated reports.'
    required: false
    default: ''
  strict:
    description: Fail the step when architecture checks report any new error.
    required: false
    default: 'false'
  markers:
    description: Comma-separated custom marker interfaces (e.g. ICommand,IQuery).
    required: false
    default: ''
  handler-markers:
    description: Comma-separated custom handler roots for external wrappers (e.g. ICommandHandler,IQueryHandler).
    required: false
    default: ''
  analysis:
    description: 'Analysis backend override: empty (config/default), text, or roslyn.'
    required: false
    default: ''
  config:
    description: Path to a .cqrslens.json file; empty auto-discovers at the scan root.
    required: false
    default: ''
  baseline:
    description: Baseline file for new-only strict checks.
    required: false
    default: ''
  sarif-output:
    description: SARIF 2.1.0 file to write; set to empty to disable.
    required: false
    default: 'cqrslens-results.sarif'
  upload-sarif:
    description: Upload the generated SARIF to GitHub code scanning.
    required: false
    default: 'false'
  annotations:
    description: Emit file/line GitHub Actions annotations for new findings.
    required: false
    default: 'true'
  version:
    description: CqrsLens NuGet tool version to install.
    required: false
    default: '0.5.1'

outputs:
  report-path:
    description: Path of the generated report file.
    value: ${{ steps.scan.outputs.report-path }}
  sarif-path:
    description: Path of the generated SARIF file (empty when disabled).
    value: ${{ steps.scan.outputs.sarif-path }}

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Install CqrsLens
      shell: bash
      env:
        CQRSLENS_VERSION: ${{ inputs.version }}
      run: |
        if ! dotnet tool install --global CqrsLens --version "$CQRSLENS_VERSION"; then
          dotnet tool update --global CqrsLens --version "$CQRSLENS_VERSION"
        fi

    - name: Scan
      id: scan
      shell: bash
      env:
        CQRSLENS_PATH: ${{ inputs.path }}
        CQRSLENS_OUTPUT: ${{ inputs.output }}
        CQRSLENS_FORMAT: ${{ inputs.format }}
        CQRSLENS_RENDER: ${{ inputs.render }}
        CQRSLENS_WATERMARK: ${{ inputs.watermark }}
        CQRSLENS_STRICT: ${{ inputs.strict }}
        CQRSLENS_MARKERS: ${{ inputs.markers }}
        CQRSLENS_HANDLER_MARKERS: ${{ inputs.handler-markers }}
        CQRSLENS_ANALYSIS: ${{ inputs.analysis }}
        CQRSLENS_CONFIG: ${{ inputs.config }}
        CQRSLENS_BASELINE: ${{ inputs.baseline }}
        CQRSLENS_SARIF: ${{ inputs.sarif-output }}
        CQRSLENS_ANNOTATIONS: ${{ inputs.annotations }}
        CQRSLENS_SUMMARY: ${{ runner.temp }}/cqrslens-summary.md
      run: |
        args=("$CQRSLENS_PATH" -o "$CQRSLENS_OUTPUT" --format "$CQRSLENS_FORMAT" \
          --ci-root "$GITHUB_WORKSPACE" \
          --summary "$CQRSLENS_SUMMARY")
        if [ -n "$CQRSLENS_RENDER" ]; then
          args+=(--render "$CQRSLENS_RENDER")
        fi
        if [ -n "$CQRSLENS_WATERMARK" ]; then
          args+=(--watermark "$CQRSLENS_WATERMARK")
        fi
        if [ "$CQRSLENS_STRICT" = "true" ]; then
          args+=(--strict)
        fi
        if [ -n "$CQRSLENS_MARKERS" ]; then
          args+=(--markers "$CQRSLENS_MARKERS")
        fi
        if [ -n "$CQRSLENS_HANDLER_MARKERS" ]; then
          args+=(--handler-markers "$CQRSLENS_HANDLER_MARKERS")
        fi
        if [ -n "$CQRSLENS_ANALYSIS" ]; then
          args+=(--analysis "$CQRSLENS_ANALYSIS")
        fi
        if [ -n "$CQRSLENS_CONFIG" ]; then
          args+=(--config "$CQRSLENS_CONFIG")
        fi
        if [ -n "$CQRSLENS_BASELINE" ]; then
          args+=(--baseline "$CQRSLENS_BASELINE")
        fi
        if [ -n "$CQRSLENS_SARIF" ]; then
          args+=(--sarif "$CQRSLENS_SARIF")
        fi
        if [ "$CQRSLENS_ANNOTATIONS" = "true" ]; then
          args+=(--github-annotations)
        fi

        set +e
        cqrslens "${args[@]}"
        status=$?
        set -e

        echo "report-path=$CQRSLENS_OUTPUT" >> "$GITHUB_OUTPUT"
        echo "sarif-path=$CQRSLENS_SARIF" >> "$GITHUB_OUTPUT"
        if [ -f "$CQRSLENS_SUMMARY" ]; then
          cat "$CQRSLENS_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$status"

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cqrslens-architecture-report
        path: ${{ inputs.output }}
        if-no-files-found: warn

    - name: Upload SARIF artifact
      if: always() && inputs.sarif-output != ''
      uses: actions/upload-artifact@v7
      with:
        name: cqrslens-sarif
        path: ${{ inputs.sarif-output }}
        if-no-files-found: warn

    - name: Upload SARIF to code scanning
      if: always() && inputs.upload-sarif == 'true' && inputs.sarif-output != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-output }}
        category: cqrslens
