name: Verify release package and publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then
            echo "::error::Could not read <Version> from Directory.Build.props"
            exit 1
          fi
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match package version '$version'."
            exit 1
          fi
          echo "Verifying CqrsLens $version for tag $GITHUB_REF_NAME"

  verify:
    needs: verify-version
    uses: ./.github/workflows/ci.yml

  publish:
    # A manual dispatch verifies the package and uploads it for inspection.
    if: github.event_name == 'release'
    needs: verify
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Download verified package
        uses: actions/download-artifact@v8
        with:
          name: package-ubuntu-latest
          path: artifacts

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: Abdullahhakimam

      - name: Push to NuGet
        env:
          CQRSLENS_NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --api-key "$CQRSLENS_NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
